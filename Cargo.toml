[package]
name = "rice_farmer"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 3
lto = "thin"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
strip = true

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"